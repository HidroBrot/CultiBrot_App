name: hidrobrot_app
description: HidroBrot – Cultivo inteligente (Sensores + Relés + Cultibrot + MetgeBrot + SocialBrot + Tienda + Splash)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.6.6
  # Extras
  image_picker: ^1.0.7
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # ✅ Assets oficiales de HidroBrot
  assets:
    - assets/images/HBlogo.png
